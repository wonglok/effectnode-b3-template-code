<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>bone tilt probe</title></head>
  <body><pre id="log"></pre>
  <script type="module">
    import { parseManifest } from "/src/b3/b3-runtime/src/components/AvatarSDK/manifest.ts";
    import { loadGLB } from "/src/b3/b3-runtime/src/components/AvatarSDK/decoders.ts";
    import { loadMotionClips } from "/src/b3/b3-runtime/src/components/AvatarSDK/motionLibrary.ts";

    const rotDeg = (w) => (2 * Math.acos(Math.min(1, Math.max(-1, w))) * 180) / Math.PI;

    window.__result = { status: "running" };
    try {
      const res = await fetch("/char/avatar.manifest.json");
      const manifest = parseManifest(await res.json());
      const body = await loadGLB(manifest.assets.body);
      const bodyScene = body.scene;
      const scan = async (name, url) => {
        const map = await loadMotionClips([{ name, url }], bodyScene);
        const clip = map.get(name);
        const rows = [];
        for (const t of clip.tracks) {
          if (!t.name.endsWith(".quaternion")) continue;
          const bone = t.name.slice(0, -10);
          const N = t.times.length;
          let mn = Infinity, mx = 0;
          for (let i = 0; i < N; i++) {
            const d = rotDeg(t.values[i * 4 + 3]);
            if (d < mn) mn = d;
            if (d > mx) mx = d;
          }
          rows.push({ bone, minDeg: +mn.toFixed(0), maxDeg: +mx.toFixed(0) });
        }
        rows.sort((a, b) => b.maxDeg - a.maxDeg);
        return rows.slice(0, 10);
      };
      const out = [];
      for (const [name, url] of [
        ["happy-hand-gesture", "/char/motion-2/fbx/gesture/happy-hand-gesture.fbx"],
        ["dismissing-gesture", "/char/motion-2/fbx/gesture/dismissing-gesture.fbx"],
        ["annoyed-head-shake", "/char/motion-2/fbx/gesture/annoyed-head-shake.fbx"],
        ["lengthy-head-nod", "/char/motion-2/fbx/gesture/lengthy-head-nod.fbx"],
      ]) out.push({ name, top: await scan(name, url) });
      window.__result = { status: "done", out };
    } catch (e) {
      window.__result = { status: "error", error: String((e && e.message) || e) };
    }
    document.getElementById("log").textContent = JSON.stringify(window.__result, null, 2);
  </script>
  </body>
</html>
